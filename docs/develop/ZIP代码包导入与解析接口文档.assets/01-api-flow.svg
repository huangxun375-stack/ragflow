<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="570" viewBox="0 0 1180 570" role="img" aria-labelledby="01-api-flow-title">
<title id="01-api-flow-title">接口调用关系：受理不等于完成</title>
<defs><marker id="01-api-flow-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#54758b"/></marker></defs>
<rect width="1180" height="570" fill="#ffffff"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#19354b">
<text x="30" y="37" font-size="24" text-anchor="start" font-weight="600" fill="#19354b">接口调用关系：受理不等于完成</text>
<rect x="30" y="90" width="220" height="100" rx="8" fill="#fff4e3" stroke="#bc852f" stroke-width="1.6"/>
<text x="140.0" y="120" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">上传 ZIP</text>
<text x="140.0" y="147" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">POST documents</text>
<text x="140.0" y="171" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">取得文档 ID</text>
<rect x="320" y="90" width="220" height="100" rx="8" fill="#f0f4f8" stroke="#8294a8" stroke-width="1.6"/>
<text x="430.0" y="120" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">发起解析</text>
<text x="430.0" y="147" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">POST documents/parse</text>
<text x="430.0" y="171" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">检查 success_count</text>
<rect x="610" y="90" width="240" height="100" rx="8" fill="#fff4e3" stroke="#bc852f" stroke-width="1.6"/>
<text x="730.0" y="120" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">查询文档状态</text>
<text x="730.0" y="147" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">GET documents?id=…</text>
<text x="730.0" y="171" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">任务与归档状态</text>
<polyline points="250,140 320,140" fill="none" stroke="#54758b" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="320,140 311.0,144.0 311.0,136.0" fill="#54758b"/>
<polyline points="540,140 610,140" fill="none" stroke="#54758b" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="610,140 601.0,144.0 601.0,136.0" fill="#54758b"/>
<text x="430" y="220" font-size="15" text-anchor="middle" font-weight="400" fill="#19354b">success_count &gt; 0 才进入受理后流程</text>
<rect x="920" y="90" width="230" height="100" rx="8" fill="#e9f6ef" stroke="#318366" stroke-width="1.6"/>
<text x="1035.0" y="120" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">读取文件树 / 切片</text>
<text x="1035.0" y="147" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">archive_tree / chunks</text>
<text x="1035.0" y="171" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">比较 archive_run_id</text>
<polyline points="850,140 920,140" fill="none" stroke="#54758b" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="920,140 911.0,144.0 911.0,136.0" fill="#54758b"/>
<text x="890" y="75" font-size="15" text-anchor="middle" font-weight="400" fill="#19354b">完成且已发布</text>
<polyline points="730,90 730,65 580,65 580,140 610,140" fill="none" stroke="#54758b" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="610,140 601.0,144.0 601.0,136.0" fill="#54758b"/>
<text x="570" y="46" font-size="15" text-anchor="middle" font-weight="400" fill="#19354b">未结束：继续查询</text>
<rect x="610" y="290" width="240" height="100" rx="8" fill="#ffffff" stroke="#b6c5d2" stroke-width="1.6"/>
<text x="730.0" y="320" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">失败 / 停止</text>
<text x="730.0" y="347" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">读取失败原因或停止状态</text>
<text x="730.0" y="371" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">按需要再次发起解析</text>
<polyline points="730,190 730,290" fill="none" stroke="#54758b" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="730,290 726.0,281.0 734.0,281.0" fill="#54758b"/>
<rect x="920" y="290" width="230" height="100" rx="8" fill="#ffffff" stroke="#b6c5d2" stroke-width="1.6"/>
<text x="1035.0" y="320" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">删除进行中的文档</text>
<text x="1035.0" y="347" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">先请求停止，再等 STOPPED</text>
<text x="1035.0" y="371" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">删除后检查 deleted</text>
<polyline points="850,165 885,165 885,340 920,340" fill="none" stroke="#54758b" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="920,340 911.0,344.0 911.0,336.0" fill="#54758b"/>
<rect x="851.0" y="235" width="68.0" height="20" rx="2" fill="#ffffff"/>
<text x="885" y="250" font-size="15" text-anchor="middle" font-weight="400" fill="#4b667a">需要删除</text>
<text x="30" y="480" font-size="16" text-anchor="start" font-weight="400" fill="#657b8d">上传失败不继续；已取得文档 ID 后，发起解析失败不应通过重复上传重试。</text>
<text x="30" y="520" font-size="16" text-anchor="start" font-weight="400" fill="#657b8d">状态查询返回 data.docs；文件树 not_ready 不代表正在运行；单切片未发布可能返回业务错误。</text>
</g>
</svg>