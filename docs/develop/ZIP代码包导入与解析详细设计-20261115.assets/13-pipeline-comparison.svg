<text x="1345.0" y="226" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">分批写入 ES</text>
<text x="60" y="294" font-size="16" text-anchor="start" font-weight="400" fill="#657b8d">Parser 内部选择 PDF / DOCX 等解析实现；图中框为 Pipeline 定义中的组件。</text>
<rect x="30" y="355" width="1180" height="230" rx="10" fill="#fafcfe" stroke="#d6e0e8" stroke-dasharray="5 4"/>
<text x="46" y="382" font-size="17" text-anchor="start" font-weight="600" fill="#657b8d">ZIP 代码包 · 内置 code_archive Pipeline（固定流程）</text>
<rect x="60" y="420" width="110" height="130" rx="8" fill="#f0f4f8" stroke="#8294a8" stroke-width="1.6"/>
<text x="72" y="441" font-size="12" text-anchor="start" font-weight="400" fill="#8294a8">复用节点</text>
<text x="115.0" y="469" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">File</text>
<text x="115.0" y="496" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">文档入口</text>
<rect x="215" y="420" width="705" height="130" rx="8" fill="#e9f6ef" stroke="#318366" stroke-width="1.6"/>
<text x="227" y="441" font-size="12" text-anchor="start" font-weight="400" fill="#318366">新增解析节点 · parserNode</text>
<text x="567.5" y="469" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">CodeArchive</text>
<text x="567.5" y="496" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">安全读取与过滤 · 结构识别 · 代码切片</text>
