<text x="585.0" y="226" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">通用切片</text>
<rect x="740" y="150" width="180" height="110" rx="8" fill="#f0f4f8" stroke="#8294a8" stroke-width="1.6"/>
