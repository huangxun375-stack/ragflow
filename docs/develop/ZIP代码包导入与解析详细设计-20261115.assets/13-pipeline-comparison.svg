<text x="1345.0" y="726" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">树 / 统计 → MySQL</text>
<polyline points="1345,550 1345,650" fill="none" stroke="#54758b" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="1345,650 1341.0,641.0 1349.0,641.0" fill="#54758b"/>
<rect x="1311.0" y="593" width="68.0" height="20" rx="2" fill="#ffffff"/>
<text x="1345" y="608" font-size="15" text-anchor="middle" font-weight="400" fill="#4b667a">索引写完</text>
<polyline points="850,710 1240,710" fill="none" stroke="#54758b" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="1240,710 1231.0,714.0 1231.0,706.0" fill="#54758b"/>
<rect x="988.5" y="680" width="113.0" height="20" rx="2" fill="#ffffff"/>
<text x="1045" y="695" font-size="15" text-anchor="middle" font-weight="400" fill="#4b667a">不进入切片正文</text>
<text x="45" y="808" font-size="17" text-anchor="start" font-weight="400" fill="#19354b">CodeArchive 与 Parser 同属 Pipeline 解析节点；它同时完成代码切片，因此不再连接普通 Chunker / Extractor。</text>
<text x="45" y="843" font-size="16" text-anchor="start" font-weight="400" fill="#657b8d">灰色：已有 / 复用；绿色：新增；橙色：已有模块适配。虚线传递元数据，不代表新增一个 DSL 节点。</text>
</g>
