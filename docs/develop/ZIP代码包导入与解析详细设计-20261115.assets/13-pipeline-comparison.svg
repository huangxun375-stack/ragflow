<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="875" viewBox="0 0 1480 875" role="img" aria-labelledby="13-pipeline-comparison-title">
<title id="13-pipeline-comparison-title">两类解析流程：同一 Pipeline 框架，不同节点组合</title>
<defs><marker id="13-pipeline-comparison-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#54758b"/></marker></defs>
<rect width="1480" height="875" fill="#ffffff"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#19354b">
