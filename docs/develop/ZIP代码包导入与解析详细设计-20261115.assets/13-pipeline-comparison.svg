<text x="1252" y="441" font-size="12" text-anchor="start" font-weight="400" fill="#bc852f">流程外 · ZIP 适配</text>
<text x="1345.0" y="469" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">索引执行器</text>
<text x="1345.0" y="496" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">分批写入 ES</text>
<rect x="375" y="665" width="475" height="90" rx="8" fill="#ffffff" stroke="#b6c5d2" stroke-width="1.6"/>
<text x="612.5" y="695" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">执行期 Collector（非节点）</text>
<text x="612.5" y="722" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">暂存文件树与统计</text>
<polyline points="567,550 567,665" fill="none" stroke="#54758b" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="567,665 563.0,656.0 571.0,656.0" fill="#54758b"/>
<rect x="599.5" y="603" width="83.0" height="20" rx="2" fill="#ffffff"/>
<text x="641" y="618" font-size="15" text-anchor="middle" font-weight="400" fill="#4b667a">元数据旁路</text>
<rect x="1240" y="650" width="210" height="110" rx="8" fill="#e9f6ef" stroke="#318366" stroke-width="1.6"/>
<text x="1252" y="671" font-size="12" text-anchor="start" font-weight="400" fill="#318366">流程外 · Ingestor</text>
