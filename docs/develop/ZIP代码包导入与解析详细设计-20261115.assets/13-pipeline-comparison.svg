<rect x="965" y="420" width="210" height="130" rx="8" fill="#fff4e3" stroke="#bc852f" stroke-width="1.6"/>
<text x="977" y="441" font-size="12" text-anchor="start" font-weight="400" fill="#bc852f">已有节点 · 代码适配</text>
<text x="1070.0" y="469" font-size="19" text-anchor="middle" font-weight="600" fill="#19354b">Tokenizer</text>
<text x="1070.0" y="496" font-size="16" text-anchor="middle" font-weight="400" fill="#19354b">词项 / 向量</text>
<polyline points="170,485 215,485" fill="none" stroke="#54758b" stroke-width="1.8" stroke-linejoin="round"/>
